version: '3.8'

services:
  # PostgreSQL Database Container
  postgres:
    image: postgres:16-alpine
    container_name: cravekart-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: cravekart
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cravekart"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Backend Express API
  server:
    build:
      context: ./server
      dockerfile: ../Dockerfile.server
    container_name: cravekart-server
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      CLIENT_URL: http://localhost:3000
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/cravekart?schema=public
      JWT_SECRET: super-secret-cravekart-jwt-key-min-32-chars-long-12345
      COOKIE_SECRET: super-secret-cravekart-cookie-key-56789
      RAZORPAY_KEY_ID: rzp_test_placeholder_key_id
      RAZORPAY_KEY_SECRET: rzp_test_placeholder_key_secret
      RAZORPAY_WEBHOOK_SECRET: rzp_test_webhook_secret
    ports:
      - "5000:5000"

  # Frontend React SPA with Nginx
  client:
    build:
      context: ./client
      dockerfile: ../Dockerfile.client
    container_name: cravekart-client
    restart: always
    depends_on:
      - server
    ports:
      - "3000:80"

volumes:
  postgres_data:
    driver: local
